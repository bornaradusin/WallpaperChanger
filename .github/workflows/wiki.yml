# Publishes the Markdown pages in wiki/ to the repo's GitHub wiki.
# Runs when a release is published, or by hand.
# The wiki has to exist first: on GitHub, open the Wiki tab and save the first page once.
name: Wiki

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-repo || {
            echo "::error::The wiki doesn't exist yet. On GitHub open the Wiki tab, save the first page once, then run this again."
            exit 1
          }
          rsync -a --delete --exclude .git wiki/ wiki-repo/
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Nothing changed"; exit 0; }
          git commit -m "Wiki for ${GITHUB_SHA::7}"
          git push
